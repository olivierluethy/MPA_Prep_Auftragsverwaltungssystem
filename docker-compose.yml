services:
  # ----------------------------------------------------------------------
  # MySQL database. On the very first start it automatically runs every
  # *.sql file in docker/init (schema + mock data).
  # ----------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: minipa_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ----------------------------------------------------------------------
  # The PHP / Apache web application.
  # ----------------------------------------------------------------------
  app:
    build: .
    container_name: minipa_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${APP_PORT}:80"
    volumes:
      # Live-mount the source code so edits are visible without rebuilding.
      - .:/var/www/html/Mini-PA-Prep

  # ----------------------------------------------------------------------
  # phpMyAdmin – the web page to browse / edit the MySQL database.
  # ----------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: minipa_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT}:80"

volumes:
  db_data:
