<VirtualHost *:80>
    # Serve the application directly at the root, so URLs are short:
    #   http://localhost:8100/          -> overview (or login)
    #   http://localhost:8100/login
    #   http://localhost:8100/auftraege
    DocumentRoot /var/www/html/Mini-PA-Prep

    # AllowOverride All enables the project's .htaccess (the pretty-URL router).
    <Directory /var/www/html/Mini-PA-Prep>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
